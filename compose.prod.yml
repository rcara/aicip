# Production-shaped Compose. Do not run this without an explicit deployment decision.
# No domain is assumed. Postgres has no published port.
# Resource caps are a starting hypothesis for a shared 16 GB VPS, not a measured capacity.
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - aicip_pg_data:/var/lib/postgresql
    networks:
      - aicip_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 1536m
    cpus: "1.0"

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set BETTER_AUTH_URL}
      AI_COACH_MODE: ${AI_COACH_MODE:-mock}
      AI_API_KEY: ${AI_API_KEY:-}
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - aicip_internal
    restart: unless-stopped
    mem_limit: 1536m
    cpus: "1.0"

networks:
  aicip_internal:
    internal: true

volumes:
  aicip_pg_data:
