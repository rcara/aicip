name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: aicip
          POSTGRES_PASSWORD: aicip
          POSTGRES_DB: aicip
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aicip -d aicip"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://aicip:aicip@localhost:5432/aicip
      BETTER_AUTH_SECRET: ci-only-secret-not-for-production-use-32
      BETTER_AUTH_URL: http://127.0.0.1:3000
      AI_COACH_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run scenario:validate
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
