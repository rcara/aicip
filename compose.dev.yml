# Local development. PostgreSQL is bound to loopback only.
# Dev-only database password, not a production secret.
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: aicip
      POSTGRES_PASSWORD: aicip
      POSTGRES_DB: aicip
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - aicip_pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicip -d aicip"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 1536m
    cpus: "1.0"

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://aicip:aicip@postgres:5432/aicip
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in the shell or a gitignored .env}
      BETTER_AUTH_URL: http://127.0.0.1:3000
      AI_COACH_MODE: mock
    ports:
      - "127.0.0.1:3000:3000"
    mem_limit: 1536m
    cpus: "1.0"

volumes:
  aicip_pg_data:
